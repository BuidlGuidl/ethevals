  key_env: HARBOR_API_KEY
judge:
  model: anthropic/claude-opus-5-5
  effort: high
  paid_by: api_key
  cost_limit_usd: 2.0
  key_env: ANTHROPIC_API_KEY
modes: [vanilla, internet, skills]
models:
  opus-5.5:
    name: anthropic/claude-opus-5-5
    effort: high
