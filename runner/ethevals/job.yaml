    modes: [vanilla]
    paid_by: api_key
    cost_limit_usd: 20.0
    env:
      OPENROUTER_API_KEY: '${OPENROUTER_API_KEY:-}'
  vanilla-grok-4.7:
    name: ethevals.vanilla:VanillaAgent
    version: 0.1.0
    model: grok-4.7
    modes: [vanilla]
    paid_by: api_key
    cost_limit_usd: 20.0
    env:
      OPENROUTER_API_KEY: '${OPENROUTER_API_KEY:-}'
  vanilla-gemini-4-argon:
    name: ethevals.vanilla:VanillaAgent
    version: 0.1.0
    model: gemini-4-argon
    modes: [vanilla]
    paid_by: api_key
    cost_limit_usd: 20.0
    env:
      OPENROUTER_API_KEY: '${OPENROUTER_API_KEY:-}'
  claude-code-opus-5.5:
    name: claude-code
    version: 2.1.284
    model: opus-5.5
    modes: [internet, skills]
    paid_by: plan
    cost_limit_usd: 20.0
    env:
      # Harbor 0.24.0 redacts AUTH values; uppercase preserves JSON numbers and booleans.
      CLAUDE_FORCE_OAUTH: "YES"
    required_env: [CLAUDE_CODE_OAUTH_TOKEN]
  claude-code-fable-5.1:
    name: claude-code
    version: 2.1.284
    model: fable-5.1
    modes: [internet, skills]
    paid_by: plan
    cost_limit_usd: 20.0
    env:
      # Harbor 0.24.0 redacts AUTH values; uppercase preserves JSON numbers and booleans.
      CLAUDE_FORCE_OAUTH: "YES"
    required_env: [CLAUDE_CODE_OAUTH_TOKEN]
  codex-gpt-6.1-sol:
    name: codex
    version: 0.163.0
    model: gpt-6.1-sol
    modes: [internet, skills]
    paid_by: plan
    cost_limit_usd: 20.0
    env:
      CODEX_FORCE_AUTH_JSON: "YES"
      # CI writes the credential file; reserve its input name and clear the raw JSON.
      CODEX_AUTH_JSON: ""
    required_files:
      - path: '${CODEX_AUTH_JSON_PATH:-~/.codex/auth.json}'
        policy: plan_tokens
  codex-gpt-6-astra:
    name: codex
    version: 0.163.0
    model: gpt-6-astra
    modes: [internet, skills]
    paid_by: plan
    cost_limit_usd: 20.0
    env:
      CODEX_FORCE_AUTH_JSON: "YES"
      # CI writes the credential file; reserve its input name and clear the raw JSON.
      CODEX_AUTH_JSON: ""
    required_files:
      - path: '${CODEX_AUTH_JSON_PATH:-~/.codex/auth.json}'
        policy: plan_tokens
  opencode-kimi-k3.1-pro:
    name: opencode
    version: 1.18.33
    model: kimi-k3.1-pro
    modes: [internet, skills]
    paid_by: api_key
    cost_limit_usd: 20.0
    env:
      OPENROUTER_API_KEY: '${OPENROUTER_API_KEY:-}'
      EXA_API_KEY: '${EXA_API_KEY:-}'
      # OpenCode 1.x caps each model call at 32k tokens (ADR 0015).
      # Harbor 0.24.0 redacts TOKEN values; the plus sign keeps that off JSON numbers.
      OPENCODE_EXPERIMENTAL_OUTPUT_TOKEN_MAX: '+131072'
  opencode-glm-5.3:
    name: opencode
    version: 1.18.33
    model: glm-5.3
    modes: [internet, skills]
    paid_by: api_key
    cost_limit_usd: 20.0
