    effort: high
  gpt-6-astra:
    name: openai/gpt-6-astra
    effort: high
  kimi-k3.1-pro:
    name: openrouter/moonshotai/kimi-k3.1-pro
    effort: high
  glm-5.3:
    name: openrouter/z-ai/glm-5.3
    effort: high
  deepseek-v4.1-flash-1017:
    name: openrouter/deepseek/deepseek-v4.1-flash-1017
    effort: high
  grok-4.7:
    name: openrouter/x-ai/grok-4.7
    effort: high
  gemini-4-argon:
    name: openrouter/google/gemini-4-argon
    effort: high
agents:
  vanilla-opus-5.5:
    name: ethevals.vanilla:VanillaAgent
    version: 0.1.0
    model: opus-5.5
    modes: [vanilla]
    paid_by: api_key
    cost_limit_usd: 20.0
    env:
      ANTHROPIC_API_KEY: '${ANTHROPIC_API_KEY:-}'
  vanilla-gpt-6.1-sol:
    name: ethevals.vanilla:VanillaAgent
    version: 0.1.0
    model: gpt-6.1-sol
    modes: [vanilla]
    paid_by: api_key
    cost_limit_usd: 20.0
    env:
      OPENAI_API_KEY: '${OPENAI_API_KEY:-}'
  vanilla-kimi-k3.1-pro:
    name: ethevals.vanilla:VanillaAgent
    version: 0.1.0
    model: kimi-k3.1-pro
    modes: [vanilla]
    paid_by: api_key
    cost_limit_usd: 20.0
    env:
      OPENROUTER_API_KEY: '${OPENROUTER_API_KEY:-}'
