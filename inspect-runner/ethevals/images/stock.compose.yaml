services:
  default:
    mem_limit: 3g
    init: true
    networks: [work, agent_internet]
  scorer:
    mem_limit: 2g
    init: true
    networks: [scorer_internet]
networks:
  work:
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
  agent_internet: {}
  scorer_internet: {}
