services:
  default:
    build: .
    image: ethevals-solidity:foundry-1.5.1-solc-0.8.30-std-1.9.7
    init: true
    networks: [private, internet]
  scorer:
    image: ethevals-solidity:foundry-1.5.1-solc-0.8.30-std-1.9.7
    init: true
    networks: [private]
  chain:
    build:
      context: .
      dockerfile: Chain.Dockerfile
    image: ethevals-chain:foundry-1.5.1-v1
    init: true
    networks: [private]
    healthcheck:
      test: [CMD, cast, chain-id, --rpc-url, http://127.0.0.1:8545]
      interval: 1s
      timeout: 3s
      retries: 30
networks:
  private:
    internal: true
  internet: {}
