# TODO: For real runs, set opus-5.5 and gpt-5.5 effort to high.
# Omit effort for kimi-k3 and glm-5.3 to use provider defaults.
# Set grader effort to medium.
# TODO: Use 3 epochs for real runs; 3 epochs can exceed CI's 6-hour job; split the run first.
epochs: 1
time_limits: {quiz: 120, build: 1200, act: 600}
cost_limit: 5.0
max_attempts: 2
concurrency: 1
grader:
  model: anthropic/claude-opus-5-5
  effort: low
  max_tokens: 32768 # Includes adaptive thinking and the JSON verdict.
search: true
search_limit: 20
# Model slugs and all prices are guesses. Check them before a paid epoch.
# Prices are USD per million tokens, including separate cache rates.
models:
  opus-5.5:
    model: anthropic/claude-opus-5-5
    effort: low
  gpt-5.5:
    model: openai/gpt-5.5
    effort: low
  kimi-k3:
    model: openrouter/moonshotai/kimi-k3
    effort: low
  glm-5.3:
    model: openrouter/z-ai/glm-5.3
    effort: low
agents:
  claude-code-opus-5.5:
    harness: claude_code
    model: opus-5.5
    cli_model: claude-opus-5-5
    search: native
  codex-cli-gpt-5.5:
    harness: codex_cli
    model: gpt-5.5
    cli_model: gpt-5.5
    search: native
  opencode-kimi-k3:
    harness: opencode
    model: kimi-k3
    cli_model: openrouter/moonshotai/kimi-k3
    search: exa
  opencode-glm-5.3:
    harness: opencode
    model: glm-5.3
    cli_model: openrouter/z-ai/glm-5.3
    search: exa
prices:
  anthropic/claude-opus-5-5: {input: 4.0, output: 20.0, input_cache_read: 0.2, input_cache_write: 5.0}
  openai/gpt-5.5: {input: 5.0, output: 30.0, input_cache_read: 0.5, input_cache_write: 5.0}
  openrouter/moonshotai/kimi-k3: {input: 0.6, output: 2.5, input_cache_read: 0.1, input_cache_write: 0.6}
  openrouter/z-ai/glm-5.3: {input: 1.0, output: 3.2, input_cache_read: 0.2, input_cache_write: 1.0}
