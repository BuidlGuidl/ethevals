name: Publish task images and HF dataset
on:
  push:
    branches: [main]
    # The dataset holds tasks only, so results-only changes have nothing to publish.
    paths-ignore: ['results/**']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: hf-release
  cancel-in-progress: false
jobs:
  release:
    name: Publish task images and HF dataset
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      - run: uv sync --frozen
      - name: Check task folders and image pins
        run: uv run ethevals lint
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Publish shared images
        run: uv run python scripts/ci.py images --publish
      - run: uv tool install --python 3.13 --constraints scripts/hf-constraints.txt --with click huggingface-hub
      - name: Export and upload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run python scripts/ci.py release --output out/hf --license mit --publish
