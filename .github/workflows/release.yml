name: Publish HF dataset
on:
  workflow_dispatch:
    inputs:
      dataset:
        description: HF dataset repository, owner/name
        type: string
        required: true
      license:
        description: Chosen HF license identifier
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: hf-release
  cancel-in-progress: false
jobs:
  release:
    name: Publish HF dataset
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      - run: uv sync --frozen
      - run: uv tool install --python 3.13 --constraints scripts/hf-constraints.txt --with click huggingface-hub
      - name: Export and upload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET: ${{ inputs.dataset }}
          HF_LICENSE: ${{ inputs.license }}
        run: uv run python scripts/ci.py release --output out/hf --hf-repo "$HF_DATASET" --license "$HF_LICENSE" --publish
