name: Publish saved recovery results
on:
  push:
    branches: [ops/pause-claude-plan-20261028]
    paths: ['.github/workflows/publish-saved-recovery.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: eval-results
  queue: max
  cancel-in-progress: false
jobs:
  publish:
    name: Publish saved run ${{ matrix.run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - run_id: '40648625953'
            source_commit: cd26134ea3a13586f527bbab1eadf55d06baec69
            expected_artifacts: 198
            expected_rows: 405
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: false
      - run: uv sync --frozen
      - name: Download every saved trial artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS_REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ matrix.run_id }}
          EXPECTED_ARTIFACTS: ${{ matrix.expected_artifacts }}
          EXPECTED_ROWS: ${{ matrix.expected_rows }}
        run: |
          gh run download "$SOURCE_RUN_ID" --repo "$RESULTS_REPO" \
            --pattern "trial-run-$SOURCE_RUN_ID-*" --dir results/artifact
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from ethevals.trial_rows import fold_rows, recover_rows
          artifacts = sorted(Path("results/artifact").glob("trial-run-*"))
          assert len(artifacts) == int(os.environ["EXPECTED_ARTIFACTS"]), len(artifacts)
          rows = fold_rows(*(recover_rows(path) for path in artifacts))
          assert len(rows) == int(os.environ["EXPECTED_ROWS"]), len(rows)
          print(f"Downloaded {len(artifacts)} artifacts; recovered {len(rows)} rows.")
          PY
      - name: Publish checked artifacts and record rows
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS_REPO: ${{ github.repository }}
          RESULTS_RUN_ID: ${{ matrix.run_id }}
          RESULTS_COMMIT: ${{ matrix.source_commit }}
        run: >-
          uv run python scripts/ci.py publish-results
          --output results/artifact --repo "$RESULTS_REPO"
          --run-id "$RESULTS_RUN_ID" --commit "$RESULTS_COMMIT" --publish
