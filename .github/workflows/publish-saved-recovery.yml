name: Publish saved recovery results
on:
  push:
    branches: [ops/pause-claude-plan-20261028]
    paths: ['.github/workflows/publish-saved-recovery.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: eval-results
  queue: max
  cancel-in-progress: false
jobs:
  publish:
    name: Publish saved run ${{ matrix.run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - run_id: '40683192885'
            source_commit: a976a77ae8c3943c1611359d1e169ce1101a8971
          - run_id: '40683214104'
            source_commit: a976a77ae8c3943c1611359d1e169ce1101a8971
          - run_id: '40683261030'
            source_commit: a976a77ae8c3943c1611359d1e169ce1101a8971
          - run_id: '40683754949'
            source_commit: a976a77ae8c3943c1611359d1e169ce1101a8971
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: false
      - run: uv sync --frozen
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.run_id }}
          pattern: trial-run-${{ matrix.run_id }}-*
          path: results/artifact
      - name: Publish checked artifacts and record rows
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS_REPO: ${{ github.repository }}
          RESULTS_RUN_ID: ${{ matrix.run_id }}
          RESULTS_COMMIT: ${{ matrix.source_commit }}
        run: >-
          uv run python scripts/ci.py publish-results
          --output results/artifact --repo "$RESULTS_REPO"
          --run-id "$RESULTS_RUN_ID" --commit "$RESULTS_COMMIT" --publish
