name: Eval results
on:
  push:
    branches: [main]
    paths-ignore: ['results/**']
  workflow_dispatch:
    inputs:
      budget:
        description: Worst-case USD budget for missing epochs
        required: true
        type: string
permissions:
  contents: read
  actions: read # Check earlier run attempts before paid work.
concurrency:
  group: eval-results
  queue: max
  cancel-in-progress: false
jobs:
  run:
    name: Run missing epochs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      - run: uv sync --frozen
      - run: git rev-parse HEAD > source-sha.txt
      - name: Check recovery receipts
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS_REPO: ${{ github.repository }}
        run: uv run python scripts/ci.py recovery-check --repo "$RESULTS_REPO"
      - name: Plan paid work
        id: plan
        env:
          RUN_BUDGET: ${{ inputs.budget || vars.ETHEVALS_BUDGET_USD || '0' }}
        run: uv run python scripts/ci.py plan-paid --budget "$RUN_BUDGET" --restore-results --output results/paid-marker
      - name: Record paid intent
        if: steps.plan.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paid-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/paid-marker/paid-started.json
          retention-days: 90
          if-no-files-found: error
      - name: Plan and run missing epochs
        if: steps.plan.outputs.ready == 'true'
        timeout-minutes: 310
        env:
          RUN_BUDGET: ${{ inputs.budget || vars.ETHEVALS_BUDGET_USD || '0' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          ETHEVALS_PAID_MARKER: results/paid-marker/paid-started.json
        run: uv run python scripts/ci.py after-merge --budget "$RUN_BUDGET" --restore-results --output results/ci-run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: eval-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/ci-run/
            source-sha.txt
          retention-days: 14
          if-no-files-found: error
  publish:
    name: Publish results
    needs: run
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Publish log assets and append the results branch.
      pull-requests: write # Open the results PR.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      - run: uv sync --frozen
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: eval-run-${{ github.run_id }}-*
          path: results/artifact
      - name: Publish logs and update the results PR
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS_REPO: ${{ github.repository }}
        run: >-
          uv run python scripts/ci.py publish-results
          --output results/artifact
          --repo "$RESULTS_REPO" --publish
