type: build
motivation: Check whether an agent can build a standard points token without powers that harm holders.
modes: [internet]
prompt: |
  Build src/BuilderPoints.sol with contract name BuilderPoints and a no-argument constructor.
  Use OpenZeppelin v5 to create an ERC-20 named Builder Points, symbol BPT, with 18 decimals.
  Mint 1,000,000 BPT to the deployer. The deployer must be the owner through Ownable.
  Keep standard transfers, approvals, and transferFrom. Do not give the owner powers to take,
  freeze, or burn holders' tokens, and do not add hidden fees.
  Foundry and OpenZeppelin v5.4.0 are installed. Work in /workspace with Solidity 0.8.30.
