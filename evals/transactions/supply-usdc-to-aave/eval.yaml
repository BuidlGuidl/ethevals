chain: {fork: mainnet, block: 23819000}
motivation: Check whether an agent can find a live protocol on a mainnet fork and use it correctly, supplying an exact amount of USDC to Aave v3.
modes: [internet, skills]
prompt: |
  i have 25,000 USDC in my account. can you supply 10,000 of it to the main aave v3 market so it
  earns interest, and leave the rest in my wallet? chain.json has the rpc url and the private key
  of my account.
