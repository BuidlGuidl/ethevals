schema_version = "1.3"
artifacts = ["/workspace/findings.md", "/logs/agent/trajectory.json"]

[task]
name = "buidlguidl/audit-confidential-contracts"
description = "Check whether an agent auditing a confidential (FHE) token and vesting library finds the encrypted-math flaws a professional audit found."
authors = [{ name = "BuidlGuidl" }]
keywords = ["ethereum", "security", "audits", "fhe", "vesting"]

[metadata]
pillar = "build"
area = "Audits"
modes = ["internet"]

[metadata.checks]
c1_transfer_and_call_refund = "judgment"
h1_vesting_released_overflow = "judgment"

[agent]
timeout_sec = 3600

[verifier]
environment_mode = "separate"
user = "root"
timeout_sec = 1800

[verifier.env]
CLAUDE_CODE_OAUTH_TOKEN = "${CLAUDE_CODE_OAUTH_TOKEN:-}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"

[environment]
cpus = 1
memory_mb = 2048
