[judge]
judge = "claude-code"
model = "anthropic/claude-opus-5-5"
version = "2.1.321"
cwd = "/judge"
reasoning_effort = "high"
guard = "flag"
prompt_template = "judge-prompt.md"

[scoring]
aggregation = "weighted-mean"

[[criterion]]
name = "c1_transfer_and_call_refund"
type = "binary"
description = """[C-1] Critical: Invalid Return Value on Transfers With Callback
Where: ConfidentialFungibleToken._transferAndCall; ConfidentialFungibleTokenUtils.checkOnTransferReceived
_transferAndCall, behind confidentialTransferAndCall and confidentialTransferFromAndCall, moves the tokens to the recipient first, calls its onConfidentialTransferReceived, and if that returns false refunds by moving the amount back, assuming the refund cannot fail. A recipient contract can move the tokens on during the callback and then return false. A confidential transfer without enough balance moves zero instead of reverting, so the refund silently comes back empty, yet the function reports zero transferred: the recipient keeps the tokens while the sender, and any contract relying on the returned amount, is told nothing moved."""

[[criterion]]
name = "h1_vesting_released_overflow"
type = "binary"
description = """[H-1] High: Wallet Can Vest Ahead of Schedule Due to Overflow
Where: VestingWalletConfidential.release and vestedAmount
VestingWalletConfidential keeps each token's released total in a euint64, and release adds to it with FHE.add, which wraps around on overflow instead of reverting. The vested amount is computed from the wallet's balance plus that total. The owner can send released tokens back in and call release again until the counter wraps to a small number, so the schedule treats almost nothing as released and the owner takes out more than has vested so far. An underflow in releasable when the balance drops below the released total is a different flaw."""
