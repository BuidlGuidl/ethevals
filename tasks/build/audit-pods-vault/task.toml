schema_version = "1.3"
artifacts = ["/workspace/findings.md", "/logs/agent/trajectory.json"]

[task]
name = "buidlguidl/audit-pods-vault"
description = "Check whether an agent auditing Pods Finance's stETH volatility vault finds the queue, rounding and accounting flaws a professional audit found."
authors = [{ name = "BuidlGuidl" }]
keywords = ["ethereum", "security", "audits", "vaults", "erc-4626"]

[metadata]
pillar = "build"
area = "Audits"
modes = ["internet"]

[metadata.checks]
no_audit_lookup = "gate"
c1_deposit_queue_gas_lock = "judgment"
c2_processed_deposits_double_count = "judgment"
c3_withdraw_rounds_shares_down = "judgment"
h1_withdraw_blocks_end_round = "judgment"
h2_base_deposit_reentrancy = "judgment"
h3_processing_rounds_shares_up = "judgment"

[agent]
timeout_sec = 3600

[verifier]
environment_mode = "separate"
user = "root"
timeout_sec = 1800

[verifier.env]
CLAUDE_CODE_OAUTH_TOKEN = "${CLAUDE_CODE_OAUTH_TOKEN:-}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"

[environment]
cpus = 1
memory_mb = 2048
