[judge]
judge = "claude-code"
model = "anthropic/claude-opus-5-5"
version = "2.1.321"
cwd = "/judge"
reasoning_effort = "high"
guard = "flag"
prompt_template = "judge-prompt.md"

[scoring]
aggregation = "weighted-mean"

[[criterion]]
name = "c1_deposit_queue_gas_lock"
type = "binary"
description = """[C-1] Critical: DepositQueue can become permanently locked
Where: DepositQueueLib.remove; BaseVault.processQueuedDeposits and refund
DepositQueueLib.remove rebuilds the whole queue on every call, copying each remaining entry into memory and writing the full list back to storage, and both processing and refunds call it. Anyone can grow the queue with dust deposits from many addresses until processing or refunding even one entry needs more gas than a block allows. Then no queued deposit can be processed or refunded, and every one is stuck. Saying only that refunds cost more gas late in the queue is not this finding."""

[[criterion]]
name = "c2_processed_deposits_double_count"
type = "binary"
description = """[C-2] Critical: Miscounted assets breaking system invariants
Where: BaseVault.processQueuedDeposits and _processDeposit; STETHVault.totalAssets
processQueuedDeposits prices each deposit's shares against totalAssets() plus processedDeposits, which resets only at startRound. totalAssets() is the stETH balance minus the queued total, so deposits that an earlier call in the same round processed and removed from the queue are already in it, and adding processedDeposits counts them twice. Depositors processed in a later call get fewer shares than those in the first, the outcome depends on how the queue is split into calls, and they can redeem less than they put in."""

[[criterion]]
name = "c3_withdraw_rounds_shares_down"
type = "binary"
description = """[C-3] Critical: The vault can be drained one share at a time
Where: BaseVault.withdraw and _withdraw
withdraw converts the requested assets to shares with convertToShares, which rounds down, and _withdraw burns that many shares while still sending the full amount. A request worth less than one share burns nothing and still pays out, and a larger one leaves the caller the rounded-off excess. Repeating it drains the vault, at a profit once a share is worth more than a call's gas. Rounding in the preview functions, such as previewWithdraw's fee math, is a different finding."""

[[criterion]]
name = "h1_withdraw_blocks_end_round"
type = "binary"
description = """[H-1] High: Function withdraw can disable endRound
Where: STETHVault._beforeWithdraw and _afterRoundEnd; BaseVault.endRound
_beforeWithdraw lowers lastRoundAssets by the withdrawn shares valued at lastSharePrice and rounded down, which can be less than what actually leaves the vault, so lastRoundAssets can end up above totalAssets(). _afterRoundEnd then computes totalAssets() - lastRoundAssets, which underflows and reverts. An ordinary user's withdrawal stops the controller from ending the round until enough yield accrues."""

[[criterion]]
name = "h2_base_deposit_reentrancy"
type = "binary"
description = """[H-2] High: Reentrancy risk in depositing to the queue
Where: BaseVault._deposit
BaseVault._deposit adds the receiver's deposit to the queue before it pulls the tokens with safeTransferFrom. With an asset that calls the sender back before the transfer, such as an ERC-777 token, the depositor can re-enter deposit while the earlier entry is recorded but not yet paid for; naming this order as open to re-entry is enough, and no lasting excess credit need be shown. STETHVault._deposit overrides it and pulls first, so the flaw is the base version other vaults inherit, not the shipped stETH vault."""

[[criterion]]
name = "h3_processing_rounds_shares_up"
type = "binary"
description = """[H-3] High: Rounding up in minting shares
Where: BaseVault._processDeposit and processQueuedDeposits
_processDeposit mints a queued deposit's shares with mulDivUp, rounding up, so a 1-wei deposit always gets at least one smallest unit of a share. Once the vault has earned yield and one share unit is worth over 1 wei, an attacker can queue 1-wei deposits from many addresses, receive one share unit for each when the queue is processed, and redeem them for more than they paid. This is the rounding when queued deposits become shares, not the rounding in withdraw."""
