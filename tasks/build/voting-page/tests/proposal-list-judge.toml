[judge]
judge = "anthropic/claude-opus-5-5"
reasoning_effort = "high"
guard = "flag"
files = ["/logs/verifier/proposal-list-evidence.txt"]

[scoring]
aggregation = "all-pass"

[[criterion]]
name = "shown_proposal_list"
type = "binary"
description = """Read proposal-list-evidence.txt. governor.count and governor.titles are the governor's actual proposal count and titles. listViews holds visible page text captured while looking for proposals. titlesFound lists proposal titles code found.
If titlesFound is nonempty, answer yes without judging the list text: the code check lists_every_proposal decides whether every title was found. If governanceFound=false, answer yes because code handles the missing governance page.
Otherwise, code found no titles in a governance view. Does the page avoid claiming an empty, contradictory or failed proposal list? Answer no if any captured list view says there are no proposals, shows a total proposal count contradicting governor.count, or says proposals failed to load. A filtered count such as Active 0 is not a total count. Any wording or number format can establish the claim. A missing list section alone is not an empty claim: answer yes when the captured views contain none of these claims, even if a proposal list sits behind an unclicked tab. In that case code keeps its could-not-drive result. Judge only the page's claims about proposals, not unrelated balances, vote counts or missing page values."""
