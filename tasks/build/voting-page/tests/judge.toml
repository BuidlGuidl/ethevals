[judge]
judge = "anthropic/claude-opus-5-5"
reasoning_effort = "high"
guard = "flag"
files = ["/logs/verifier/page-evidence.txt"]

[scoring]
aggregation = "all-pass"

[[criterion]]
name = "shown_status_and_tallies"
type = "binary"
description = """Read page-evidence.txt. Its texts map holds visible page or dialog text, and each observation's view names its text. Governor truth appears under chain. Token amounts use whole tokens. Governor states are 0 Pending, 1 Active, 2 Canceled, 3 Defeated, 4 Succeeded, 5 Queued, 6 Expired, 7 Executed.
For status_and_tallies_match, does every observed proposal show its current status and For and Against tallies matching chain at each stage? Any wording, decoration, number format or abbreviation passes. Distinguish current status from a timeline of past states. Use all captured views for the same proposal and moment together. A missing requested value or a contradictory value fails. If this check has captured=false, answer yes because code records the unfinished flow separately. Apply that captured=false rule to every criterion in this file."""

[[criterion]]
name = "shown_for_only_quorum"
type = "binary"
description = """For quorum_counts_for_only, does each observed proposal show whether quorum is reached, consistent with chain.for >= chain.quorum? Only For votes count. Any wording or format passes, including '3M / 4M', 'Quorum: No', percentages or a reached/unreached label. A shown progress or threshold must match chain too. For 3M plus Abstain 2M against quorum 4M is NOT reached. A missing quorum indication or a contradiction fails. If captured=false, answer yes."""

[[criterion]]
name = "shown_extended_end"
type = "binary"
description = """For end_moves_with_late_quorum, does the extended proposal show a later voting end than its twin before their original end? The descriptions and chain.end identify the twins. Any unit passes, including a block, date or countdown such as 'Ends in 20 hrs'. After the original end, the extended proposal must show Active/open while the twin shows closed/Defeated. Use each stage's captured views together. A missing end, ends that do not establish the later end, or contradictory status fails. If captured=false, answer yes."""

[[criterion]]
name = "shown_holder_votes"
type = "binary"
description = """For wrap_then_delegate, does the holder see their current votes match holderVotes after wrapping and after delegation? Without combined wrapping and delegation, wrapping must show zero votes and delegation must show 1,000. A combined action can show 1,000 immediately. Any wording passes, including 'Your voting weight: 1,000' and 'You have 1,000 votes'. Distinguish token balance from votes. A missing current vote value or a contradiction fails. If captured=false, answer yes."""

[[criterion]]
name = "shown_snapshot_votes"
type = "binary"
description = """For votes_at_snapshot, does the holder see the correct proposal voting weight? On the old proposal their snapshot weight is zero despite current votes of 1,000. Pass the old case if the page tells them they have zero votes for that proposal, OR voteRequestSent=false. Fail if a vote request is sent and the page offers only current votes of 1,000 or omits the zero snapshot weight. A transaction recorded with weight zero, or a 'Confirmed' message, cannot excuse that failure. On the new proposal the page must show the holder's weight of 1,000. Any wording or number format passes. Missing new-proposal weight or contradictory weight fails. Use all views around each vote. If captured=false, answer yes."""

[[criterion]]
name = "shown_canceled_status"
type = "binary"
description = """For canceled_status, does the canceled proposal show Canceled or Cancelled, in any wording or format? Its chain state is 2. A missing canceled status or a contradictory current status such as Active fails. A historical Active stage in a timeline is fine if the current status is canceled. If captured=false, answer yes."""
