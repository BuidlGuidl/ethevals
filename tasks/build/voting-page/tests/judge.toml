[judge]
judge = "anthropic/claude-opus-5-5"
reasoning_effort = "high"
timeout = 900
guard = "flag"
files = ["/logs/verifier/source-evidence.txt"]
prompt_template = "source-prompt.txt"

[scoring]
aggregation = "all-pass"

[[criterion]]
name = "lists_every_proposal"
type = "binary"
description = "Does the holder reach every governor proposal through the rendered page? Trace complete event scans through the latest partial range, IDs, pagination, filtering, and rendered views. A successful scan must show all proposals. Distinguish a complete successful scan from retained cached data after a failed refresh. Explicit loading or refresh errors must not claim a fresh empty or complete list. A stale cached view with an error notice is not itself proof of an incomplete successful scan."

[[criterion]]
name = "status_and_tallies_match"
type = "binary"
description = "Does each proposal show current governor state and For and Against tallies? Trace state and proposalVotes reads, proposal IDs, tuple positions, formatting, rendering and refresh after changes. Current status must handle all governor states, including canceled, queued and executed. Do not confuse a timeline with current status."

[[criterion]]
name = "quorum_counts_for_only"
type = "binary"
description = "Does each proposal show quorum reached and any shown progress using only For votes and the governor quorum at its snapshot? Follow counting mode, threshold, units and display. Abstain cannot contribute to this governor's quorum."

[[criterion]]
name = "end_moves_with_late_quorum"
type = "binary"
description = "Does the page read and show the effective proposalDeadline after late quorum extends voting? Trace refresh, deadline units, status, and the vote control and handler. After the original end, the extended proposal must remain open while an unextended twin closes. A snapshot-eligible holder must be able to send For with full snapshot weight even after their recent delegated power falls to zero. Do not assume snapshot-eligible holders retain recent votes. Check governor target, proposal ID, support 1, optional reason and receipt refresh."

[[criterion]]
name = "wrap_then_delegate"
type = "binary"
description = "Can a connected TOKEN holder approve, wrap into the deployed vote token, self-delegate, and see their current delegated votes? Trace amount input and units, allowance or approval spender, deposit recipient, delegate address, wallet and chain configuration, receipts, errors and refreshed reads into display. Wrapping alone gives no delegated votes; self-delegation activates them. A combined action is valid."

[[criterion]]
name = "votes_at_snapshot"
type = "binary"
description = "Does proposal voting use the connected holder's votes at that proposal's snapshot, both for displayed weight and eligibility? A holder who delegates after an old snapshot has zero weight there; show zero or prevent the request. A later proposal after delegation must show the full snapshot weight and allow For. Eligibility must remain valid if recent delegated votes later fall to zero. Trace reads, UI state, handlers, governor address, proposal ID, support 1, optional reason, receipts and refresh. A successful zero-weight receipt cannot establish correct UI behavior."

[[criterion]]
name = "canceled_status"
type = "binary"
description = "Does the current governor Canceled state reach the displayed proposal status and prevent a vote request? Trace the status read, ID, UI state and transaction handler. Accept either spelling and any control wording."

[[criterion]]
name = "already_voted"
type = "binary"
description = "Does governor hasVoted for the connected holder and selected proposal prevent a duplicate vote request? Trace reads into controls and handlers, account and proposal changes, and receipt refresh."
