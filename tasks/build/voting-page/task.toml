schema_version = "1.3"
artifacts = [{ source = "/workspace", exclude = ["node_modules", "dist", ".git", "chain_context.json"] }]

[task]
name = "buidlguidl/voting-page"
description = "Build a holder voting page that follows proposal state, quorum, deadlines, and snapshot voting power."
authors = [{ name = "BuidlGuidl" }]
keywords = ["ethereum", "governance", "react", "wagmi", "anvil"]

[metadata]
pillar = "build"
modes = ["internet", "skills"]

[metadata.checks]
# Reported only in the free check, where no judge runs.
free_submission_changed = "gate"
lists_every_proposal = "gate"
status_and_tallies_match = "gate"
quorum_counts_for_only = "judgment"
end_moves_with_late_quorum = "judgment"
wrap_then_delegate = "gate"
votes_at_snapshot = "judgment"
canceled_status = "gate"
already_voted = "judgment"

[verifier]
environment_mode = "shared"
user = "root"
timeout_sec = 1800

[verifier.env]
CLAUDE_CODE_OAUTH_TOKEN = "${CLAUDE_CODE_OAUTH_TOKEN:-}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"

[environment]
cpus = 1
memory_mb = 4096
