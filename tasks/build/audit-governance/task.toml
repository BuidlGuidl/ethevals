schema_version = "1.3"
artifacts = ["/workspace"]

[task]
name = "buidlguidl/audit-governance"
description = "Check whether an agent's audit of a vote-escrow governor and timelock finds the known High vulnerabilities."
authors = [{ name = "BuidlGuidl" }]
keywords = ["ethereum", "solidity", "security", "audit", "governance"]

[metadata]
pillar = "build"
area = "Audits"
modes = ["internet"]

[verifier]
environment_mode = "separate"
user = "root"

[verifier.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}"

[environment]
cpus = 1
memory_mb = 2048
