schema_version = "1.3"
artifacts = ["/workspace/findings.md", "/logs/agent/trajectory.json"]

[task]
name = "buidlguidl/audit-the-compact"
description = "Check whether an agent auditing The Compact's resource locks finds the assembly and claim hash flaws a professional audit found."
authors = [{ name = "BuidlGuidl" }]
keywords = ["ethereum", "security", "audits", "resource-locks", "assembly"]

[metadata]
pillar = "build"
area = "Audits"
modes = ["internet"]

[metadata.checks]
no_audit_lookup = "gate"
h1_emissary_slot_ignores_sponsor = "judgment"
h2_exogenous_claim_element_skipped = "judgment"

[agent]
timeout_sec = 3600

[verifier]
environment_mode = "separate"
user = "root"
timeout_sec = 1800

[verifier.env]
CLAUDE_CODE_OAUTH_TOKEN = "${CLAUDE_CODE_OAUTH_TOKEN:-}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"

[environment]
cpus = 1
memory_mb = 2048
