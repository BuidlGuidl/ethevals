[judge]
judge = "claude-code"
model = "anthropic/claude-opus-5-5"
version = "2.1.321"
cwd = "/judge"
reasoning_effort = "high"
guard = "flag"
prompt_template = "judge-prompt.md"

[scoring]
aggregation = "all-pass"

[[criterion]]
name = "h1_emissary_slot_ignores_sponsor"
type = "binary"
description = """[H-1] High: Single Emissary Configuration Allows Users to Set Emissaries for Others
Where: EmissaryLib._getEmissaryConfig, assignEmissary and verifyWithEmissary
_getEmissaryConfig builds the storage slot of a sponsor's emissary settings in scratch memory with assembly, writing the scope, then the sponsor address, then the 12-byte lockTag, but the lockTag write lands on top of the sponsor address. The hashed slot is therefore built from just the scope constant and the lockTag, so all sponsors using one lockTag share one emissary setting, and any user can assign or replace the emissary for every other sponsor with that lockTag. An emissary set this way can approve claims against those sponsors' locked funds in place of their signatures."""

[[criterion]]
name = "h2_exogenous_claim_element_skipped"
type = "binary"
description = """[H-2] High: Bypassing Element Verification Allows for Unauthorized Manipulation of Exogenous Claim Data
Where: HashLib.toExogenousMultichainClaimMessageHash
Rebuilding the signed hash for a multichain claim on a chain other than the first, toExogenousMultichainClaimMessageHash writes the current element's hash, which commits to its arbiter, lock IDs and amounts, only when the loop reaches chainIndex. If chainIndex is out of range for additionalChains, that hash is never written, and with five elements in total the word read in its place is the witness, which the claimant controls. Putting the last signed element's hash in the witness rebuilds the exact signed hash without the current element, so an attacker can claim as arbiter with their own recipients and amounts, front-running the real claim and reusing its allocator authorization."""
