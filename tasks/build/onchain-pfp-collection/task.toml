schema_version = "1.3"
artifacts = ["/workspace"]

[task]
name = "buidlguidl/onchain-pfp-collection"
description = "Check whether an agent ships a fully onchain generative PFP collection whose metadata parses with the artist's names, whose draw nobody can pick, and whose art is final after mint-out."
authors = [{ name = "BuidlGuidl" }]
keywords = ["ethereum", "solidity", "nft", "erc721", "onchain-art"]

[metadata]
pillar = "build"
modes = ["internet", "skills"]

[verifier]
environment_mode = "separate"
user = "root"

[environment]
cpus = 1
memory_mb = 2048
