[judge]
judge = "claude-code"
model = "anthropic/claude-opus-5-5"
version = "2.1.321"
cwd = "/judge"
reasoning_effort = "high"
guard = "flag"
prompt_template = "judge-prompt.md"

[scoring]
aggregation = "weighted-mean"

[[criterion]]
name = "tob_cap_4_notify_timer_reset"
type = "binary"
description = """[TOB-CAP-4] Medium: StakedCap yield distribution DoS through timer manipulation
Where: StakedCap.notify, lockedProfit and totalAssets
Anyone can call notify(). Only when the contract's cUSD balance is above storedTotal does it add the difference to the locked profit and reset lastNotify to now; lockedProfit() releases that profit linearly over lockDuration from lastNotify. By sending 1 wei of cUSD and calling notify() again and again, an attacker restarts the vesting each time, so the yield still locked keeps being pushed back and stakers wait far longer for it, for as long as the attacker goes on. A staker depositing just before notify() to share in new yield is a different finding."""

[[criterion]]
name = "tob_cap_5_balance_tracking"
type = "binary"
description = """[TOB-CAP-5] High: Inconsistent balance tracking in vault creates DoS for asset borrowing
Where: VaultLogic.burn; Vault.availableBalance; Lender.maxBorrowable
The vault tracks totalSupplies and totalBorrows per asset, and availableBalance returns the first minus the second. VaultLogic.burn lowers totalSupplies by the payout and pays it from the vault's real token balance, never checking the payout against the available balance. Once a user sends tokens straight to the vault, outside mint, a burn can take more than is available and push totalSupplies below totalBorrows. availableBalance can then no longer be computed, so the lender's maxBorrowable fails and agents can no longer borrow that asset anywhere in the protocol."""

[[criterion]]
name = "tob_cap_12_vault_adapter_rate"
type = "binary"
description = """[TOB-CAP-12] High: Unvalidated _vault address in VaultAdapter allows interest rate manipulation
Where: VaultAdapter.rate
Anyone can call VaultAdapter.rate(_vault, _asset). It reads currentUtilizationIndex and utilization from the _vault it is given without checking that it is the real vault for _asset, and stores the result in the utilization data it keeps for _asset, which sets the rate multiplier. An attacker passes a contract that returns chosen values for a real asset and pushes up the utilization rate the oracle reports for it, so agents across the protocol pay inflated interest through InterestDebtToken. Frequent mints and burns that damp the rate are a different finding."""

[[criterion]]
name = "tob_cap_13_fee_auction_zero_assets"
type = "binary"
description = """[TOB-CAP-13] High: Fee auction allows buying zero assets, leading to front-running attacks
Where: FeeAuction.buy and _transferOutAssets
FeeAuction.buy charges the current price and pays out whatever balance of each listed asset the contract holds, and _transferOutAssets skips a zero balance instead of reverting; the buyer cannot name the auction or the amounts they expect. When two buys for one auction are pending, the first empties it and doubles the next start price, and the second still pays the new price and gets nothing. A front-runner who copies a pending buy therefore takes the assets and leaves the victim paying for an empty auction. A buyer passing an empty asset list by mistake is a different finding."""

[[criterion]]
name = "tob_cap_14_health_vs_slashable"
type = "binary"
description = """[TOB-CAP-14] High: Discrepancy between health calculation and slashable collateral computation
Where: Delegation.coverage and slashTimestamp; NetworkMiddleware.coverage and coverageByVault
An agent's coverage, which sets its health and how much it may borrow, counts all collateral delegated to it now, but slashTimestamp lets a liquidation slash only collateral delegated before the later of the previous epoch's start and the agent's last borrow. Collateral added after that slash snapshot therefore props up the agent's health but cannot be slashed. Friendly delegators can rescue a failing agent's health, escape slashing if it is liquidated anyway, and withdraw afterwards, and when liquidation can reach too little collateral the protocol takes the loss."""

[[criterion]]
name = "tob_cap_15_reward_delegation_snapshot"
type = "binary"
description = """[TOB-CAP-15] High: Reward distribution enables front-running attacks and reward siphoning
Where: Delegation.distributeRewards; NetworkMiddleware.distributeRewards
When an agent repays a loan, the interest meant for restakers is split by each network's and vault's coverage at that moment, with no regard for how long the collateral backed the loan. A vault or restaker that sees a pending repayment can delegate to the agent just before it and take a share of interest from a loan whose risk it never carried, at the expense of long-standing backers. A cUSD staker depositing in StakedCap just before notify() is a different finding."""

[[criterion]]
name = "tob_cap_17_staked_cap_decimals"
type = "binary"
description = """[TOB-CAP-17] High: Wrong capTokenDecimals value used in StakedCapAdapter.price causes inaccurate prices
Where: StakedCapAdapter.price
StakedCapAdapter.price uses capTokenDecimals, the decimal count such as 18, where it needs the scale 10 to that power: it calls convertToAssets(capTokenDecimals) instead of converting one whole share, and divides by capTokenDecimals instead of 10^decimals. The staked token's price is therefore computed from the wrong unit and comes out wrong or imprecise."""

[[criterion]]
name = "tob_cap_19_oracle_sandwich"
type = "binary"
description = """[TOB-CAP-19] Medium: Oracle update front-running allows extraction of value from vaults
Where: Vault.mint and burn; MinterLogic.amountOut
The vault mints and burns cUSD against each asset at the current oracle prices, and the mint and burn fees can be smaller than the price move that triggers a Chainlink update. Someone who sees a pending price update can mint cUSD just before it at the old price and burn just after it at the new one, taking the size of the move out of the vault each time. Frequent mints and burns that damp the interest rate, and front-running fee auctions or reward payouts, are different findings."""
