schema_version = "1.3"
artifacts = ["/workspace/findings.md", "/logs/agent/trajectory.json"]

[task]
name = "buidlguidl/audit-cap-labs"
description = "Check whether an agent auditing CAP's stablecoin, lending and restaking contracts finds the accounting, oracle and front-running flaws a professional audit found."
authors = [{ name = "BuidlGuidl" }]
keywords = ["ethereum", "security", "audits", "stablecoins", "lending", "restaking"]

[metadata]
pillar = "build"
area = "Audits"
modes = ["internet"]

[metadata.checks]
tob_cap_12_vault_adapter_rate = "judgment"
tob_cap_13_fee_auction_zero_assets = "judgment"
tob_cap_14_health_vs_slashable = "judgment"
tob_cap_15_reward_delegation_snapshot = "judgment"
tob_cap_17_staked_cap_decimals = "judgment"
tob_cap_19_oracle_sandwich = "judgment"
tob_cap_4_notify_timer_reset = "judgment"
tob_cap_5_balance_tracking = "judgment"

[agent]
timeout_sec = 3600

[verifier]
environment_mode = "separate"
user = "root"
timeout_sec = 1800

[verifier.env]
CLAUDE_CODE_OAUTH_TOKEN = "${CLAUDE_CODE_OAUTH_TOKEN:-}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"

[environment]
cpus = 1
memory_mb = 2048
