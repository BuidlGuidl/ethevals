[judge]
judge = "claude-code"
model = "anthropic/claude-opus-5-5"
version = "2.1.321"
cwd = "/judge"
reasoning_effort = "high"
guard = "flag"
prompt_template = "judge-prompt.md"

[scoring]
aggregation = "all-pass"

[[criterion]]
name = "tob_balv3_1_buffer_approval_left"
type = "binary"
description = """[TOB-BALV3-1] High: Lack of approval reset on buffer allows anyone to drain the Vault
Where: Vault._wrapWithBuffer and erc4626BufferWrapOrUnwrap
When a buffer can't cover a wrap and the Vault wraps through the wrapper itself, the EXACT_IN path of _wrapWithBuffer approves the wrapper for amountToDeposit of the underlying token, calls deposit, and never resets that approval. Anyone can use a buffer for a wrapper they wrote, through erc4626BufferWrapOrUnwrap. A wrapper that takes nothing in deposit keeps the allowance and, once the Vault is locked again, pulls the underlying tokens of other pools out with transferFrom, outside the Vault's accounting; repeated, this drains the Vault."""

[[criterion]]
name = "tob_balv3_2_fee_collection_reserves"
type = "binary"
description = """[TOB-BALV3-2] High: Lack of reserve updates when collecting fees allows anyone to drain the Vault
Where: VaultAdmin.collectAggregateFees; Vault.erc4626BufferWrapOrUnwrap and _updateReservesAfterWrapping
Anyone can call collectAggregateFees, which lets the ProtocolFeeController pull each pool's fees out of the Vault but leaves the recorded reserves, _reservesOf, unchanged, so the real balance falls below them. When erc4626BufferWrapOrUnwrap wraps or unwraps through the wrapper itself, _updateReservesAfterWrapping compares recorded reserves with real balances to see what moved, so it counts the gap as tokens that left and credits the caller. An attacker with a wrapper they wrote takes the gap, and a pool paying 100% fees to its creator lets them grow it to the Vault's whole balance of a token."""

[[criterion]]
name = "tob_balv3_6_buffer_asset_switch"
type = "binary"
description = """[TOB-BALV3-6] High: Vault can be drained by updating the buffer underlying token
Where: Vault.erc4626BufferWrapOrUnwrap and _wrapWithBuffer; VaultAdmin.addLiquidityToBuffer and removeLiquidityFromBuffer
The Vault asks the wrapper's asset() for a buffer's underlying token on each call, and erc4626BufferWrapOrUnwrap checks it against _bufferAssets only once addLiquidityToBuffer has recorded it on the first deposit. An attacker's wrapper names a worthless token as its asset, builds balance on its uninitialized buffer through wraps (for example by returning zero from convertToShares), switches asset() to a valuable token such as DAI, initializes the buffer with a zero deposit for shares, and removes liquidity in DAI. This drains any token the Vault holds. A remark only about zero amounts taking the own-liquidity branch, without the asset switch, is a different flaw."""
