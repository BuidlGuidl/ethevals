schema_version = "1.3"
artifacts = ["/workspace/findings.md", "/logs/agent/trajectory.json"]

[task]
name = "buidlguidl/audit-thena"
description = "Check whether an agent auditing THENA's ve(3,3) voter, minter and gauges finds the reward and gauge lifecycle flaws a professional audit found."
authors = [{ name = "BuidlGuidl" }]
keywords = ["ethereum", "security", "audits", "ve33", "gauges"]

[metadata]
pillar = "build"
area = "Audits"
modes = ["internet"]

[metadata.checks]
c1_period_update_erases_rewards = "judgment"
h1_extra_rewarder_past_period = "judgment"
h2_killed_gauge_votes_stay_in_total = "judgment"
h3_vote_for_killed_gauge = "judgment"
h4_total_kill_locks_voters = "judgment"

[agent]
timeout_sec = 3600

[verifier]
environment_mode = "separate"
user = "root"
timeout_sec = 1800

[verifier.env]
CLAUDE_CODE_OAUTH_TOKEN = "${CLAUDE_CODE_OAUTH_TOKEN:-}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"

[environment]
cpus = 1
memory_mb = 2048
