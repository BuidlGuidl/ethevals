[judge]
judge = "claude-code"
model = "anthropic/claude-opus-5-5"
version = "2.1.321"
cwd = "/judge"
reasoning_effort = "high"
guard = "flag"
prompt_template = "judge-prompt.md"

[scoring]
aggregation = "weighted-mean"

[[criterion]]
name = "c1_batch_calldata_targets"
type = "binary"
description = """[C-1] Critical: Validator and Account Resolve the Same Batch Calldata to Different Targets
Where: ERC734Validator._scopeAllows and _targetAllowed; SmartAccount._execute
The validator checks a batch user operation by decoding its calldata, and the account decodes the same bytes again when it runs the batch. The two decodes check their offsets against different calldata, so a crafted batch shows the validator an ordinary external target while the account calls the identity itself. A signer with only an ACTION key can then make the identity call itself, for example addKey to give itself a MANAGEMENT key."""

[[criterion]]
name = "h1_queued_factory_call"
type = "binary"
description = """[H-1] High: Queued Approval Omits the Factory Guard That Auto-Approval Enforces
Where: KeyApprovalModule._canAutoApprove, approve and _runApproved; IdentityFactory.revokeAccount
Auto-approval refuses a call to the identity factory from a key without MANAGEMENT, but approve() accepts an ACTION key for it. An ACTION key can queue a factory call such as revokeAccount and approve it itself, and the module then runs it under its own MANAGEMENT key. The factory makes a management-only change, such as revoking one of the identity's linked wallets for good."""

[[criterion]]
name = "h2_key_registry_target"
type = "binary"
description = """[H-2] High: Key Registry Not Recognized as a Privileged Call Target
Where: KeyApprovalModule._canAutoApprove and approve; SmartAccount._authorizeCall
The key registry is the validator module, and it stores keys under whichever identity calls it. KeyApprovalModule guards only self-calls and the factory, so an ACTION key may queue a call to the registry. Only the account's _authorizeCall stops that call, and only when the validator is also installed as an executor, as the reference deployment does, although the contracts allow an identity without it. On an identity set up without that, an ACTION key can give itself a MANAGEMENT key and remove the owner's keys."""
