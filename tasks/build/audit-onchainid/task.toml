schema_version = "1.3"
artifacts = ["/workspace/findings.md", "/logs/agent/trajectory.json"]

[task]
name = "buidlguidl/audit-onchainid"
description = "Check whether an agent auditing ONCHAINID's ERC-7579 identity accounts finds the key permission flaws a professional audit found."
authors = [{ name = "BuidlGuidl" }]
keywords = ["ethereum", "security", "audits", "smart-accounts", "identity"]

[metadata]
pillar = "build"
area = "Audits"
modes = ["internet"]

[metadata.checks]
c1_batch_calldata_targets = "judgment"
h1_queued_factory_call = "judgment"
h2_key_registry_target = "judgment"

[agent]
timeout_sec = 3600

[verifier]
environment_mode = "separate"
user = "root"
timeout_sec = 1800

[verifier.env]
CLAUDE_CODE_OAUTH_TOKEN = "${CLAUDE_CODE_OAUTH_TOKEN:-}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"

[environment]
cpus = 1
memory_mb = 2048
