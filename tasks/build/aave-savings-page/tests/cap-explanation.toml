[judge]
judge = "claude-code"
model = "anthropic/claude-opus-5-5"
version = "2.1.321"
cwd = "/judge"
reasoning_effort = "high"
guard = "flag"

[scoring]
aggregation = "all-pass"

[[criterion]]
name = "explains_supply_cap"
type = "binary"
description = "After the verifier enters a USDC deposit above Aave's remaining supply cap, does the saved page explain in words that the market's supply cap or deposit limit prevents that deposit? Use cap-page.txt and cap-page.png as the evidence. A disabled button alone, a generic transaction error, or a raw error selector does not pass. If the evidence says the page could not be driven, answer no."
