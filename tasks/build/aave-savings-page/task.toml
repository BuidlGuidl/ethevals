schema_version = "1.3"
artifacts = [{ source = "/workspace", exclude = ["node_modules", "dist", ".git", "chain_context.json"] }]

[task]
name = "buidlguidl/aave-savings-page"
description = "Check an Aave v3 savings page through deposits, withdrawals, displayed values, and wallet requests on a mainnet fork."
authors = [{ name = "BuidlGuidl" }]
keywords = ["ethereum", "aave", "react", "wagmi", "fork"]

[metadata]
pillar = "build"
modes = ["internet", "skills"]

[metadata.checks]
deposit_usdc = "gate"
withdraw_partial = "gate"
withdraw_all = "gate"
deposit_usdt_leftover_allowance = "judgment"
refuses_over_cap = "judgment"
shows_deposit = "gate"
shows_apy = "gate"
explains_supply_cap = "judgment"
switches_and_continues = "judgment"

[verifier]
environment_mode = "shared"
user = "root"
timeout_sec = 2700

[verifier.env]
CLAUDE_CODE_OAUTH_TOKEN = "${CLAUDE_CODE_OAUTH_TOKEN:-}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"

[environment]
cpus = 1
memory_mb = 4096
