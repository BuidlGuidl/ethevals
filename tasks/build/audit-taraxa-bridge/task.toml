schema_version = "1.3"
artifacts = ["/workspace/findings.md", "/logs/agent/trajectory.json"]

[task]
name = "buidlguidl/audit-taraxa-bridge"
description = "Check whether an agent auditing the Taraxa bridge and its light clients finds the finality and reentrancy flaws a professional audit found."
authors = [{ name = "BuidlGuidl" }]
keywords = ["ethereum", "security", "audits", "bridges", "light-clients"]

[metadata]
pillar = "build"
area = "Audits"
modes = ["internet"]

[metadata.checks]
no_audit_lookup = "gate"
tob_tara_4_duplicate_signatures = "judgment"
tob_tara_6_apply_state_reentrancy = "judgment"

[agent]
timeout_sec = 3600

[verifier]
environment_mode = "separate"
user = "root"
timeout_sec = 1800

[verifier.env]
CLAUDE_CODE_OAUTH_TOKEN = "${CLAUDE_CODE_OAUTH_TOKEN:-}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"

[environment]
cpus = 1
memory_mb = 2048
