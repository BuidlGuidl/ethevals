[judge]
judge = "claude-code"
model = "anthropic/claude-opus-5-5"
version = "2.1.321"
cwd = "/judge"
reasoning_effort = "high"
guard = "flag"
prompt_template = "judge-prompt.md"

[scoring]
aggregation = "all-pass"

[[criterion]]
name = "tob_intuition_6_create_atom_protocol_fee"
type = "binary"
description = """[TOB-INTUITION-6] Medium: Protocol deposit fees are unaccounted for in createAtom
Where: EthMultiVault.createAtom and _depositOnVaultCreation
createAtom computes the protocol fee on the user's deposit (msg.value minus the atom cost) and sends it to the protocol vault with the atom creation fee, yet _depositOnVaultCreation credits the whole deposit to the new vault's assets and mints shares for all of it. The vault counts ETH already paid out, so its shares claim more than the contract holds and the last to redeem bears the shortfall. createTriple and the batch and compressed creation paths repeat it; a report naming any of them for this reason counts."""

[[criterion]]
name = "tob_intuition_10_triple_hash_collision"
type = "binary"
description = """[TOB-INTUITION-10] Medium: Triple identifiers can contain hash collisions
Where: EthMultiVault.tripleHashFromAtoms and createTriple
tripleHashFromAtoms makes a triple's identifier by hashing abi.encodePacked of the three atoms' stored data, which are variable-length bytes, so the boundaries between them are lost and atoms that split the same bytes differently, such as "ab", "c" and "a", "bc", give the same hash. createTriple refuses a hash already taken, so an attacker can create atoms and a triple that collide with one someone else means to create, squat on its identifier and block the real triple."""

[[criterion]]
name = "tob_intuition_12_atom_equity_base"
type = "binary"
description = """[TOB-INTUITION-12] Medium: Atom equity should be calculated on raw asset amounts
Where: EthMultiVault.depositTriple, _depositIntoVault and _distributeAtomEquity
The part of a triple deposit that buys shares in its three atoms (atomEquityFeeAmount) is computed twice on different amounts: _depositIntoVault leaves it out of the triple vault's assets based on the full msg.value, while depositTriple hands _distributeAtomEquity an amount based on the deposit after the protocol fee. The atoms receive less than the triple vault left out, and the difference belongs to no vault and stays stuck in the contract. This is the mismatch between the two calculations, not a protocol fee charged on the atoms' deposits."""

[[criterion]]
name = "tob_intuition_13_atom_equity_protocol_fee"
type = "binary"
description = """[TOB-INTUITION-13] Medium: Distributing atom equity should not include protocol fees
Where: EthMultiVault._distributeAtomEquity, _depositIntoVault and depositTriple
_distributeAtomEquity deposits each atom's part of a triple deposit through _depositIntoVault, which takes the protocol fee again on each part, although depositTriple already charged it on the whole deposit. _distributeAtomEquity ignores the fee that _depositIntoVault returns, so it never reaches the protocol vault: it is left out of the atom vaults' assets and stays stuck, and the depositor gets fewer atom shares than the equity paid for. This is the fee taken inside the distribution, not the mismatch between depositTriple's two atom equity calculations."""

[[criterion]]
name = "tob_intuition_20_min_share_assets"
type = "binary"
description = """[TOB-INTUITION-20] Medium: Asset accounting should not be reduced by minShare
Where: EthMultiVault._depositOnVaultCreation
When a vault is created, _depositOnVaultCreation mints minShare ghost shares to the zero address, and the creator pays minShare wei for them in the atom or triple cost, but only the receiver's assets are added to the new vault's total assets. The vault starts with more shares than assets, so its shares are worth less than was paid, and the ETH behind the ghost shares sits in the contract counted by no vault. createAtom minting the ghost shares twice is a different, lower finding."""
