[judge]
judge = "anthropic/claude-opus-5-5"
reasoning_effort = "high"
guard = "flag"
files = ["/logs/verifier/findings.md"]

[scoring]
aggregation = "all-pass"

[[criterion]]
name = "undeploy_keeps_harvest_baseline"
type = "binary"
description = """The file holds an audit report on the Sluice contracts.
The known vulnerability: BaseStrategy.undeploy sends assets back to the vault but never lowers deployedAssets, the baseline that harvest measures profit against (deploy raises it and undeployAll zeroes it). SluiceVault calls undeploy whenever a user withdrawal needs more than the idle balance (_ensureIdle) and in deallocate and reallocate. At the next harvest, totalAssets is compared with a baseline that still counts the withdrawn assets, so real interest is read as a smaller profit or as a loss, the baseline is reset, and the treasury's performance fee on that interest is never booked. For example, 50,000 USDC of interest followed by a 200,000 USDC withdrawal from the strategy books a 150,000 loss and no fee, so the treasury loses its fee on routine withdrawals.
Would fixing the vulnerability described in the report also fix this vulnerability? Answer yes if a finding names this mechanism on this code path, in any wording or at any severity. Answer no if the report only names the same contract, the same impact, or a broad bug class without this mechanism and path."""

[[criterion]]
name = "accrued_fees_in_total_assets"
type = "binary"
description = """The file holds an audit report on the Sluice contracts.
The known vulnerability: SluiceVault._harvest books the performance fee as accruedFees and leaves it in the vault as idle USDC until claimFees pays the treasury, but SluiceVault.totalAssets counts the vault's whole USDC balance and never subtracts accruedFees. Until the fee is claimed, the share price includes USDC owed to the treasury, so convertToAssets, previewRedeem and withdrawals overpay, and deposits are priced too high. A depositor who redeems between harvest and claimFees takes part of the treasury's fee, and when claimFees pays out, the share price falls and the depositors who stayed make up the difference.
Would fixing the vulnerability described in the report also fix this vulnerability? Answer yes if a finding names this mechanism on this code path, in any wording or at any severity. Answer no if the report only names the same contract, the same impact, or a broad bug class without this mechanism and path."""
