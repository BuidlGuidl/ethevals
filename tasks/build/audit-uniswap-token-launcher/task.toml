schema_version = "1.3"
artifacts = ["/workspace/findings.md", "/logs/agent/trajectory.json"]

[task]
name = "buidlguidl/audit-uniswap-token-launcher"
description = "Check whether an agent auditing Uniswap's Token Launcher finds the flaws a professional audit found where the launch strategy hands off to its auction."
authors = [{ name = "BuidlGuidl" }]
keywords = ["ethereum", "security", "audits", "token-launch", "auctions", "uniswap-v4"]

[metadata]
pillar = "build"
area = "Audits"
modes = ["internet"]

[metadata.checks]
c1_reserve_stuck_without_graduation = "judgment"
h1_unchecked_auction_recipients = "judgment"

[agent]
timeout_sec = 3600

[verifier]
environment_mode = "separate"
user = "root"
timeout_sec = 1800

[verifier.env]
CLAUDE_CODE_OAUTH_TOKEN = "${CLAUDE_CODE_OAUTH_TOKEN:-}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"

[environment]
cpus = 1
memory_mb = 2048
