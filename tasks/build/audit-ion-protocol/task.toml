schema_version = "1.3"
artifacts = ["/workspace/findings.md", "/logs/agent/trajectory.json"]

[task]
name = "buidlguidl/audit-ion-protocol"
description = "Check whether an agent auditing Ion Protocol's liquid staking lending market finds the oracle, helper and repayment flaws a professional audit found."
authors = [{ name = "BuidlGuidl" }]
keywords = ["ethereum", "security", "audits", "lending", "oracles"]

[metadata]
pillar = "build"
area = "Audits"
modes = ["internet"]

[metadata.checks]
no_audit_lookup = "gate"
c1_reserve_feed_no_access_control = "judgment"
c2_zap_repay_pays_twice = "judgment"
h1_full_repayment_reverts = "judgment"
h2_zapper_missing_approvals = "judgment"
h3_reserve_bound_per_call = "judgment"
h4_sweth_twap_history = "judgment"

[agent]
timeout_sec = 3600

[verifier]
environment_mode = "separate"
user = "root"
timeout_sec = 1800

[verifier.env]
CLAUDE_CODE_OAUTH_TOKEN = "${CLAUDE_CODE_OAUTH_TOKEN:-}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"

[environment]
cpus = 1
memory_mb = 2048
