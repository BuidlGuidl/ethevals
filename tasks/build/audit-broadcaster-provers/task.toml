schema_version = "1.3"
artifacts = ["/workspace/findings.md"]

[task]
name = "buidlguidl/audit-broadcaster-provers"
description = "Check whether an agent auditing the ERC-7888 Crosschain Broadcaster's rollup provers finds the storage proof flaws a professional audit found."
authors = [{ name = "BuidlGuidl" }]
keywords = ["ethereum", "security", "audits", "cross-chain", "storage-proofs", "rollups"]

[metadata]
pillar = "build"
area = "Audits"
modes = ["internet"]

[agent]
timeout_sec = 3600

[verifier]
environment_mode = "separate"
user = "root"

[verifier.env]
CLAUDE_CODE_OAUTH_TOKEN = "${CLAUDE_CODE_OAUTH_TOKEN:-}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"

[environment]
cpus = 1
memory_mb = 2048
