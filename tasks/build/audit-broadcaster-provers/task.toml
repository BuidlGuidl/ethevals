schema_version = "1.3"
artifacts = ["/workspace/findings.md", "/logs/agent/trajectory.json"]

[task]
name = "buidlguidl/audit-broadcaster-provers"
description = "Check whether an agent auditing the ERC-7888 Crosschain Broadcaster's rollup provers finds the storage proof flaws a professional audit found."
authors = [{ name = "BuidlGuidl" }]
keywords = ["ethereum", "security", "audits", "cross-chain", "storage-proofs", "rollups"]

[metadata]
pillar = "build"
area = "Audits"
modes = ["internet"]

[metadata.checks]
h1_optimism_anchor_game_slot = "judgment"
h2_linea_child_to_parent_mpt = "judgment"
h3_zksync_returns_publisher = "judgment"

[agent]
timeout_sec = 3600

[verifier]
environment_mode = "separate"
user = "root"
timeout_sec = 1800

[verifier.env]
CLAUDE_CODE_OAUTH_TOKEN = "${CLAUDE_CODE_OAUTH_TOKEN:-}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"

[environment]
cpus = 1
memory_mb = 2048
