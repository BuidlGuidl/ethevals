schema_version = "1.3"
artifacts = [{ source = "/workspace", exclude = ["node_modules", "dist", ".git", "chain_context.json"] }]

[task]
name = "buidlguidl/swap-page"
description = "Check Uniswap swaps, fees, minimum output, approvals, and page feedback through a browser on a mainnet fork."
authors = [{ name = "BuidlGuidl" }]
keywords = ["ethereum", "uniswap", "react", "wagmi", "fork"]

[metadata]
pillar = "build"
modes = ["internet", "skills"]

[verifier]
environment_mode = "shared"
user = "root"

[verifier.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}"

[environment]
cpus = 1
memory_mb = 4096
