schema_version = "1.3"
artifacts = ["/workspace/findings.md", "/logs/agent/trajectory.json"]

[task]
name = "buidlguidl/audit-automata-dcap"
description = "Check whether an agent auditing Automata's on-chain Intel DCAP attestation finds the certificate revocation and expiry flaws a professional audit found."
authors = [{ name = "BuidlGuidl" }]
keywords = ["ethereum", "security", "audits", "attestation", "x509"]

[metadata]
pillar = "build"
area = "Audits"
modes = ["internet"]

[metadata.checks]
tob_aut_5_stale_crl = "judgment"
tob_aut_6_root_crl_early_exit = "judgment"
tob_aut_7_zk_timestamp = "judgment"

[agent]
timeout_sec = 3600

[verifier]
environment_mode = "separate"
user = "root"
timeout_sec = 1800

[verifier.env]
CLAUDE_CODE_OAUTH_TOKEN = "${CLAUDE_CODE_OAUTH_TOKEN:-}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"

[environment]
cpus = 1
memory_mb = 2048
