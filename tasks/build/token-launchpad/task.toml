schema_version = "1.3"
artifacts = ["/workspace"]

[task]
name = "buidlguidl/token-launchpad"
description = "Check whether a bonding-curve launchpad preserves graduation and its opening price when a stranger seeds the Uniswap v2 pair first."
authors = [{ name = "BuidlGuidl" }]
keywords = ["ethereum", "solidity", "uniswap", "bonding-curve", "launchpad", "rewardkit"]

[metadata]
pillar = "build"
modes = ["internet", "skills"]

[metadata.checks]
test_opensAtCurvePrice = "gate"
test_wethSyncedIntoPair = "judgment"
test_tokensSyncedIntoPair = "judgment"
test_strangerCannotSetOpeningPrice = "judgment"
test_curveStopsAfterGraduation = "judgment"
test_lpIsBurned = "gate"
test_creatorEarnsFees = "gate"
test_everyoneCanSellBack = "gate"
test_curvesAreSeparate = "judgment"
test_graduationSpendsOnlyItsCurve = "judgment"

[verifier]
environment_mode = "separate"
user = "root"

[environment]
cpus = 1
memory_mb = 2048
