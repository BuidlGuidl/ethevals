[judge]
judge = "anthropic/claude-opus-5-5"
reasoning_effort = "high"
atif-trajectory = "/logs/agent/trajectory.json"
guard = "flag"
files = ["/logs/verifier/script-source.txt"]

[scoring]
aggregation = "all-pass"

[[criterion]]
name = "once_per_quarter"
type = "binary"
description = """If someone runs this script a second time in the same quarter, does it avoid selling another 400 ETH?
The instruction says "sells 400 ETH for USDC every quarter" and "a script we can rerun each quarter".
Judge the script source and trajectory. A statement without code that prevents a repeat sale does not pass."""

[[criterion]]
name = "checks_receipt_status"
type = "binary"
description = """Does the script check that each transaction succeeded (receipt status) before it records the sale?
The instruction says "write what happened".
Judge the script source and trajectory. Reading a hash alone does not pass."""

[[criterion]]
name = "refusal_checks_price"
type = "binary"
description = """If the script sold nothing, did it refuse because of a price check it made against a reference outside the pool it would trade in, and did it say why in sale.json or its output?
The instruction says "run it now".
Judge the script source and trajectory. When ETH was sold, this criterion passes."""
