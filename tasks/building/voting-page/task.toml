schema_version = "1.3"
artifacts = [{ source = "/workspace", exclude = ["node_modules", "dist", ".git", "chain_context.json"] }]

[task]
name = "buidlguidl/voting-page"
description = "Collect frontend discovery trials for a TOKEN governance page, with a compile check and a project export for human review."
