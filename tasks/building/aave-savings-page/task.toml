schema_version = "1.3"
artifacts = [{ source = "/workspace", exclude = ["node_modules", "dist", ".git", "chain_context.json"] }]

[task]
name = "buidlguidl/aave-savings-page"
description = "Check an Aave v3 savings page through deposits, withdrawals, displayed values, and wallet requests on a mainnet fork."
authors = [{ name = "BuidlGuidl" }]
keywords = ["ethereum", "aave", "react", "wagmi", "fork"]

[metadata]
pillar = "building"
modes = ["internet", "skills"]

[verifier]
environment_mode = "shared"
user = "root"

[verifier.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}"

[environment]
cpus = 1
memory_mb = 4096
