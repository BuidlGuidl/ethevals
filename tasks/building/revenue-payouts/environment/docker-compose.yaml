services:
  main:
    build:
      context: ../../../../inspect-runner/ethevals/images
      dockerfile: Chain.Dockerfile
    entrypoint: []
    user: agent
    working_dir: /workspace
    command:
      - sh
      - -c
      - |
        set -eu
        cat > foundry.toml <<'EOF'
        [profile.default]
        src = "src"
        test = "test"
        libs = ["lib"]
        solc = "0.8.30"
        remappings = ["forge-std/=/opt/solidity/lib/forge-std/src/"]
        ffi = false
        EOF
        exec sleep infinity
