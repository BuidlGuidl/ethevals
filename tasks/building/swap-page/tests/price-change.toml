[judge]
judge = "anthropic/claude-opus-5-5"
reasoning_effort = "high"
atif-trajectory = "/logs/agent/trajectory.json"
guard = "flag"
files = ["/logs/verifier/price-change.txt", "/logs/verifier/moved-wallet.json"]

[scoring]
aggregation = "all-pass"

[[criterion]]
name = "explains_price_change"
type = "binary"
description = "After the saved quote and a market move of about 2%, did the page tell the user the quote changed before asking the wallet for the swap? Read the before-move text, each press snapshot, and wallet request log. Accept a price-change notice, a refresh prompt, or a new confirmation that calls attention to the changed quote. A stale-quote notice with a forced Refresh also passes. Silent replacement of numbers fails. If the page could not be driven or never reached a swap request after the refresh, answer no."
