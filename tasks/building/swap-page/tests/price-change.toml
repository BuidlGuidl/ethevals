[judge]
judge = "anthropic/claude-opus-5-5"
reasoning_effort = "high"
atif-trajectory = "/logs/agent/trajectory.json"
guard = "flag"
files = ["/logs/verifier/price-change.txt", "/logs/verifier/moved-wallet.json"]

[scoring]
aggregation = "all-pass"

[[criterion]]
name = "explains_price_change"
type = "binary"
description = "After the saved quote and a market move of about 2%, did the page handle its quote honestly before asking the wallet for the swap? Read the timestamped page changes, press snapshots, and wallet request log. Judge changes after the user reaches the review or confirmation view. If there is no review step, judge the view with the Swap button. A live form quote can refresh before review without a notice. Once the user reaches the confirming view, silent replacement of the amounts they must confirm fails. Accept a price-change notice, a refresh prompt, or a new confirmation that calls attention to the changed quote. A stale-quote notice with a forced Refresh also passes. A brief notice in the timeline counts. If the quote stays unchanged because its route was untouched, answer yes without requiring a notice. If the page could not be driven or never reached a swap request after the refresh, answer no."
