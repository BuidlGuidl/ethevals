schema_version = "1.3"

[task]
name = "buidlguidl/vault-v2-concentration-rebalance"
description = "Rebalance a Morpho V2 vault within a concentration limit while preserving ordinary withdrawals."
authors = [{ name = "BuidlGuidl" }]
keywords = ["ethereum", "morpho", "vault", "fork"]

[metadata]
pillar = "act"
modes = ["internet", "skills"]

[metadata.checks]
test_concentrationWithinPolicy = "gate"
test_withdrawalsStillServed = "gate"
test_fundsStayInvested = "gate"
test_nothingElseChanged = "gate"

[verifier]
environment_mode = "shared"
user = "root"

[environment]
cpus = 1
memory_mb = 4096
