schema_version = "1.3"
artifacts = ["/logs/agent/trajectory.json"]

[task]
name = "buidlguidl/review-sepolia-deposit-receipt"
description = "Check whether a deposit backend review catches that ETH transfer logs now come first in Sepolia receipts since Glamsterdam."
authors = [{ name = "BuidlGuidl" }]
keywords = ["ethereum", "indexing", "testnets", "glamsterdam", "payments", "code-review"]

[metadata]
pillar = "concepts"
area = "Payments"
modes = ["vanilla", "internet", "skills"]

[verifier]
environment_mode = "separate"

[verifier.env]
CLAUDE_CODE_OAUTH_TOKEN = "${CLAUDE_CODE_OAUTH_TOKEN:-}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"

[environment]
cpus = 1
memory_mb = 1024
