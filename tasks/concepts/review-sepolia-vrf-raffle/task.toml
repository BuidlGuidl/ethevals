schema_version = "1.3"
artifacts = ["/logs/agent/trajectory.json"]

[task]
name = "buidlguidl/review-sepolia-vrf-raffle"
description = "Check whether a contract review catches that a 100,000 VRF callback gas limit can't pay for new storage on Sepolia since Glamsterdam."
authors = [{ name = "BuidlGuidl" }]
keywords = ["ethereum", "gas", "testnets", "glamsterdam", "chainlink", "code-review"]

[metadata]
pillar = "concepts"
area = "Tokens"
modes = ["vanilla", "internet", "skills"]

[verifier]
environment_mode = "separate"

[verifier.env]
CLAUDE_CODE_OAUTH_TOKEN = "${CLAUDE_CODE_OAUTH_TOKEN:-}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"

[environment]
cpus = 1
memory_mb = 1024
