[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "ethevals"
version = "0.1.0"
description = "Ethereum evals on Inspect"
requires-python = ">=3.13,<3.14"
dependencies = [
  "inspect-ai==0.3.271",
  "inspect-swe==0.2.71",
  "anthropic==1.8.0",
  "openai==3.19.2",
  "pydantic==2.13.5",
  "pyyaml==6.0.3",
]

[project.scripts]
ethevals = "ethevals.cli:main"

[dependency-groups]
dev = ["pytest==9.0.2"]

[tool.hatch.build.targets.wheel]
packages = ["inspect-runner/ethevals"]

[tool.pytest.ini_options]
testpaths = ["inspect-runner/tests"]
